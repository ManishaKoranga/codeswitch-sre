<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSwitch SRE</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 880px; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
  h1 { font-size: 1.4rem; margin-bottom: .2rem; }
  .sub { color: #52606d; margin-top: 0; }
  .notice { background: #fff8e1; border: 1px solid #ffe08a; padding: .6rem .8rem; border-radius: 6px; font-size: .9rem; }
  textarea { width: 100%; min-height: 80px; font: inherit; padding: .5rem; box-sizing: border-box; }
  button { font: inherit; padding: .4rem .9rem; margin: .2rem .2rem .2rem 0; border-radius: 6px; border: 1px solid #9aa5b1; background: #fff; cursor: pointer; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  button.danger { color: #b42318; }
  pre { background: #f5f7fa; padding: .8rem; border-radius: 6px; white-space: pre-wrap; }
  .action { border: 1px solid #d9e2ec; border-radius: 6px; padding: .7rem; margin: .5rem 0; }
  .status { font-weight: 600; }
  .pending { color: #b54708; } .executed { color: #067647; } .cancelled, .failed { color: #b42318; }
</style>
</head>
<body>
<h1>CodeSwitch SRE — incident commander</h1>
<p class="sub">Ask in plain language. The assistant reads metrics and proposes actions. Nothing runs until you confirm it below.</p>
<p class="notice">Simulated infrastructure for the demo. No real systems are changed.</p>

<h3>Ask the assistant</h3>
<textarea id="cmd" placeholder="e.g. Check checkout. If errors are above 2%, propose a rollback."></textarea><br>
<button class="primary" id="send">Send</button>
<pre id="reply"></pre>

<h3>Actions</h3>
<div id="actions"><em>No actions yet.</em></div>
<h3>Post-incident review</h3>
<button id="rca">Generate draft</button>
<pre id="rcaOut"></pre>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const text = await r.text();
  let body; try { body = JSON.parse(text); } catch { body = text; }
  if (!r.ok) throw new Error((body && body.detail) || body || ("HTTP " + r.status));
  return body;
}

async function loadActions() {
  const list = await api("/api/actions");
  $("actions").innerHTML = list.length ? list.map(a => `
    <div class="action">
      <div><strong>${esc(a.type)}</strong> — ${esc(a.detail)}</div>
      <div class="status ${esc(a.status.toLowerCase())}">${esc(a.status)}${a.outcome ? " · " + esc(a.outcome) : ""}</div>
      ${a.status === "PENDING" ? `<button class="primary" data-confirm="${esc(a.id)}">Confirm</button>
      <button class="danger" data-cancel="${esc(a.id)}">Cancel</button>` : ""}
    </div>`).join("") : "<em>No actions yet.</em>";
}

$("send").onclick = async () => {
  const text = $("cmd").value.trim(); if (!text) return;
  $("send").disabled = true; $("reply").textContent = "Thinking…";
  try {
    const d = await api("/api/command", { method: "POST", body: JSON.stringify({ text }) });
    $("reply").textContent = d.reply + (d.toolsUsed.length ? "\n\n[tools used: " + d.toolsUsed.join(", ") + "]" : "");
    await loadActions();
  } catch (e) { $("reply").textContent = "Error: " + e.message; }
  finally { $("send").disabled = false; }
};

$("actions").onclick = async (e) => {
  const id = e.target.dataset.confirm || e.target.dataset.cancel; if (!id) return;
  const kind = e.target.dataset.confirm ? "confirm" : "cancel";
  if (kind === "confirm" && !confirm("Run this action now?")) return;
  try {
    await api(`/api/actions/${id}/${kind}`, { method: "POST", body: JSON.stringify({ confirmedBy: "on-call engineer" }) });
    await loadActions();
  } catch (err) { alert(err.message); }
};

$("rca").onclick = async () => {
  const r = await fetch("/api/rca?title=Checkout%20errors"); $("rcaOut").textContent = await r.text();
};

loadActions().catch(() => {});
</script>
</body>
</html>
